---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: postgres-pod-update
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "toperator.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate-pods
        port: {{ .Values.service.port }}
    failurePolicy: Fail
    matchPolicy: Equivalent
    name: pg-pods.jaconi.io
    {{- with .Values.topology.selector }}
    namespaceSelector:
      matchLabels:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    reinvocationPolicy: Never
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
        scope: '*'
    sideEffects: None
    timeoutSeconds: 2
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: postgres-pvc-update
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "toperator.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate-pvcs
        port: {{ .Values.service.port }}
    failurePolicy: Fail
    matchPolicy: Equivalent
    name: pg-persistentvolumeclaims.jaconi.io
    {{- with .Values.topology.selector }}
    namespaceSelector:
      matchLabels:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    reinvocationPolicy: Never
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - persistentvolumeclaims
        scope: '*'
    sideEffects: None
    timeoutSeconds: 2