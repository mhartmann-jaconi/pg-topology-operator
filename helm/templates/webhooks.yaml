---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: postgres-pod-update
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "toperator.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate-pods
        port: {{ .Values.service.port }}
    failurePolicy: Fail
    matchPolicy: Equivalent
    name: pg-pods.{{ .Values.webhook.organization }}
    {{- with .Values.topology.selector }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    reinvocationPolicy: Never
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
        scope: '*'
    sideEffects: None
    timeoutSeconds: 2
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: postgres-cluster-update
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "toperator.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate-clusters
        port: {{ .Values.service.port }}
    failurePolicy: Fail
    matchPolicy: Equivalent
    name: pg-clusters.{{ .Values.webhook.organization }}
    reinvocationPolicy: Never
    rules:
      - apiGroups:
          - "postgresql.cnpg.io"
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - clusters/status
        scope: '*'
    sideEffects: None
    timeoutSeconds: 2