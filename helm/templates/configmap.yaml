apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "toperator.fullname" . }}
data:
  application.yaml: |
    service:
      name: {{ include "toperator.fullname" . }}
      namespace: {{ .Release.Namespace }}
    pod:
      port: {{ .Values.ports.tls }}
    metrics:
      enabled: {{ .Values.metrics.enabled }}
      port: {{ .Values.ports.metrics }}
    debug:
      enabled: {{ .Values.debug.enabled }}
      port: {{ .Values.ports.debug }}
    certificate:
      organization: {{ .Values.webhook.organization }}
    topology:
      label_region: {{ .Values.topology.labels.region }}
      label_leader: {{ .Values.topology.labels.leader }}
    log:
      level: {{ .Values.logging.level }}
      json: {{ .Values.logging.json }}