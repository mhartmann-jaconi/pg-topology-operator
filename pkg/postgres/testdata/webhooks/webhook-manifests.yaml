apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-clusters
  failurePolicy: Fail
  matchPolicy: Exact
  name: mcluster.kb.io
  reinvocationPolicy: Never
  rules:
  - apiGroups:
    - postgresql.cnpg.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - clusters
    - clusters/status
  sideEffects: None
  timeoutSeconds: 10
