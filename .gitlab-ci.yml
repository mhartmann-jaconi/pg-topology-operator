stages:
  - build

default:
  tags:
    - docker
    - no-internet
  image: docker.lp.rsint.net/builder:1.0

variables:
  APP_NAME: "pg-topology-operator"
  DOCKER_REGISTRY: "docker.lp.rsint.net"

docker:
  stage: build
  before_script:
    # TODO get an actual image tag
    - DOCKER_IMAGE=${DOCKER_REGISTRY}/platform/${APP_NAME}:latest
  script:
    - make docker-build
    - make docker-upload

helm:
  stage: build
  script:
    - make helm-package
    - make helm-upload
  artifacts:
    paths:
      - build
