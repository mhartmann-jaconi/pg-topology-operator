
stages:
  - build

default:
  tags:
    - docker
    - non-privileged
    - no-internet

variables:
  APP_NAME: "pg-topology-operator"
  DOCKER_REGISTRY: "docker.lp.rsint.net"
  DSKUBE_IMAGE: "docker-local.artifactory.lp.rsint.net/comvidence/oci-store/ci/dskube:7.4.1"

build:
  stage: build
  image: $DSKUBE_IMAGE
  before_script:
    # TODO get an actual image tag
    - DOCKER_IMAGE=${DOCKER_REGISTRY}/platform/${APP_NAME}:latest
  script: 
    - docker build -t ${DOCKER_IMAGE} -f Dockerfile .
    - docker push ${DOCKER_IMAGE}
    - helm package helm -d build
    - helm push build/* helm.com-dev01.lp.rsint.net

