stages:
  - build

default:
  tags:
    - docker
    #- no-internet
  image: docker.lp.rsint.net/base:10.33

variables:
  APP_NAME: "pg-topology-operator"
  DOCKER_REGISTRY: "docker.lp.rsint.net"

docker:
  stage: build
  before_script:
    # TODO get an actual image tag
    - DOCKER_IMAGE=${DOCKER_REGISTRY}/platform/${APP_NAME}:latest
  script:
    - apt-get update
    - apt-get install -y apt-transport-https gpg ca-certificates curl
    - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | apt-key add -
    - add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu focal stable"
    - apt-get update
    - apt-get install -y make docker-ce
    - make docker-build
    - make docker-upload

helm:
  stage: build
  script:
    - apt-get update
    - apt-get install curl gpg apt-transport-https ca-certificate --yes
    - curl -fsSL https://packages.buildkite.com/helm-linux/helm-debian/gpgkey | apt-key add -
    - add-apt-repository "deb [arch=amd64] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
    - apt-get install -y make helm
    - make helm-package
    - make helm-upload
  artifacts:
    paths:
      - build
