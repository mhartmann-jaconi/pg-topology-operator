
stages:
  - build

default:
  tags:
    - docker
    - non-privileged
    - no-internet

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  # IMPL: update APP_NAME
  APP_NAME: "pg-topology-operator"
  KANIKO_IMAGE: "docker.lp.rsint.net/comvidence/com-on-k8s/kaniko:debug"
  DOCKER_REGISTRY: "docker.lp.rsint.net"
  DSKUBE_DEST_DIR: "${CI_PROJECT_DIR}/build/deployment/package_and_deploy/dskube"

build:
  stage: build
  image: $KANIKO_IMAGE
  before_script:
    # TODO get an actual image tag
    - IMAGE=${DOCKER_REGISTRY}/platform/${APP_NAME}:latest
    - DOCKER_FILE=${CI_PROJECT_DIR}/Dockerfile
  script:
    - echo "Push OCI image to registry ${IMAGE}"
    - mkdir -p /kaniko/.docker/
    - echo "{\"auths\":{\"${DOCKER_REGISTRY}\":{\"auth\":\"$(echo -n ${ARTIFACTORY_USERNAME}:${ARTIFACTORY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${DOCKER_FILE}"
      --destination "${IMAGE}"
      --reproducible
      --skip-tls-verify
      --verbosity debug
