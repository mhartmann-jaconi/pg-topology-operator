---
default:
  image: docker.lp.rsint.net/platform/uv:3.12
  tags:
    - podman

stages:
  - version-check
  - test
  - lint
  - build
  - deploy
  - git-tag

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

app version check:
  stage: version-check
  image: docker.lp.rsint.net/coc/podman/alpine:3.23
  before_script:
    - apk add --update make podman
  script:
    - |
      set -e
      APP_VERSION="$(make --no-print-directory print-app-version)"
      DOCKER_IMAGE="$(make --no-print-directory print-docker-image)"
      DOCKER_REGISTRY="$(make --no-print-directory print-docker-registry)"

      podman login "${DOCKER_REGISTRY}" --username "${AD_USER}" --password "${AD_PASSWORD}"

      {
        printf 'APP_VERSION=%s\n' "${APP_VERSION}"
        printf 'DOCKER_IMAGE=%s\n' "${DOCKER_IMAGE}"
        printf 'DOCKER_REGISTRY=%s\n' "${DOCKER_REGISTRY}"
      } > app.env

      if podman manifest inspect "docker://${DOCKER_IMAGE}" >/dev/null 2>&1; then
        printf 'APP_RELEASE_REQUIRED=false\n' >> app.env
        echo "Docker image ${DOCKER_IMAGE} for APP_VERSION ${APP_VERSION} already exists; skipping app build/push."
      else
        printf 'APP_RELEASE_REQUIRED=true\n' >> app.env
        echo "Docker image ${DOCKER_IMAGE} does not exist yet; app build/push is required."
      fi
  artifacts:
    expire_in: 1h
    reports:
      dotenv: app.env
    paths:
      - app.env
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

helm version check:
  stage: version-check
  image: docker.lp.rsint.net/coc/podman/alpine:3.23
  before_script:
    - apk add --update make curl
  script:
    - |
      set -e
      CHART_VERSION="$(make --no-print-directory print-chart-version)"
      HELM_CHART_PACKAGE="$(make --no-print-directory print-helm-chart-package)"
      HELM_CHART_URL="$(make --no-print-directory print-helm-chart-url)"
      http_code="$(curl -k -sSL -o /dev/null -w "%{http_code}" -u "${AD_USER}:${AD_PASSWORD}" "${HELM_CHART_URL}")"

      {
        printf 'CHART_VERSION=%s\n' "${CHART_VERSION}"
        printf 'HELM_CHART_PACKAGE=%s\n' "${HELM_CHART_PACKAGE}"
        printf 'HELM_CHART_URL=%s\n' "${HELM_CHART_URL}"
      } > helm.env

      if [ "${http_code}" = "200" ]; then
        printf 'HELM_RELEASE_REQUIRED=false\n' >> helm.env
        echo "Helm chart ${HELM_CHART_PACKAGE} for CHART_VERSION ${CHART_VERSION} already exists; skipping helm package/upload."
      elif [ "${http_code}" = "404" ]; then
        printf 'HELM_RELEASE_REQUIRED=true\n' >> helm.env
        echo "Helm chart ${HELM_CHART_PACKAGE} does not exist yet; helm package/upload is required."
      else
        echo "Unexpected HTTP status ${http_code} while checking ${HELM_CHART_URL}" >&2
        exit 1
      fi
  artifacts:
    expire_in: 1h
    reports:
      dotenv: helm.env
    paths:
      - helm.env
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

merge request test:
  stage: test
  image: docker.lp.rsint.net/golang:1.27
  before_script:
    - go version
  script:
    - make test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

helm lint:
  stage: lint
  image: docker.lp.rsint.net/coc/podman/alpine:3.23
  needs:
    - job: helm version check
      artifacts: true
  before_script:
    - apk add --update make helm
  script:
    - |
      set -e
      . ./helm.env
      if [ "${HELM_RELEASE_REQUIRED}" != "true" ]; then
        echo "Helm release is not required; skipping lint."
        exit 0
      fi
      make helm-test
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

app docker build:
  stage: build
  image: docker.lp.rsint.net/coc/podman/alpine:3.23
  needs:
    - job: app version check
      artifacts: true
  before_script:
    - apk add --update make podman
  script:
    - |
      set -e
      . ./app.env
      if [ "${APP_RELEASE_REQUIRED}" != "true" ]; then
        echo "App release is not required; skipping docker build."
        : > image.tar
        exit 0
      fi
      make CONTAINER_ENGINE=podman docker-build
      podman save "${DOCKER_IMAGE}" -o image.tar
  artifacts:
    expire_in: 1h
    paths:
      - image.tar
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

helm package:
  stage: build
  image: docker.lp.rsint.net/coc/podman/alpine:3.23
  needs:
    - job: helm version check
      artifacts: true
    - job: helm lint
      artifacts: false
  before_script:
    - apk add --update make helm
  script:
    - |
      set -e
      . ./helm.env
      : > .helm-package-artifact
      if [ "${HELM_RELEASE_REQUIRED}" != "true" ]; then
        echo "Helm release is not required; skipping package."
        exit 0
      fi
      make helm-package
  artifacts:
    expire_in: 1h
    paths:
      - "*.tgz"
      - .helm-package-artifact
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

app docker push:
  stage: deploy
  image: docker.lp.rsint.net/coc/podman/alpine:3.23
  needs:
    - job: app version check
      artifacts: true
    - job: app docker build
      artifacts: true
  before_script:
    - apk add --update podman
  script:
    - |
      set -e
      . ./app.env
      if [ "${APP_RELEASE_REQUIRED}" != "true" ]; then
        echo "App release is not required; skipping docker push."
        exit 0
      fi
      podman login "${DOCKER_REGISTRY}" --username "${AD_USER}" --password "${AD_PASSWORD}"
      podman load -i image.tar
      podman push "${DOCKER_IMAGE}"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

helm upload:
  stage: deploy
  image: docker.lp.rsint.net/coc/podman/alpine:3.23
  needs:
    - job: helm version check
      artifacts: true
    - job: helm package
      artifacts: true
  before_script:
    - apk add --update make curl
  script:
    - |
      set -e
      . ./helm.env
      if [ "${HELM_RELEASE_REQUIRED}" != "true" ]; then
        echo "Helm release is not required; skipping upload."
        exit 0
      fi
      make helm-upload
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

app git tag:
  stage: git-tag
  image: docker.lp.rsint.net/coc/podman/alpine:3.23
  needs:
    - job: app version check
      artifacts: true
    - job: app docker push
      artifacts: false
  before_script:
    - apk add --update make git
    - git config user.name "GitLab CI"
    - git config user.email "gitlab-ci@${CI_SERVER_HOST}"
  script:
    - |
      set -e
      . ./app.env
      make git-tag-app
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

helm git tag:
  stage: git-tag
  image: docker.lp.rsint.net/coc/podman/alpine:3.23
  needs:
    - job: helm version check
      artifacts: true
    - job: helm upload
      artifacts: false
  before_script:
    - apk add --update make git
    - git config user.name "GitLab CI"
    - git config user.email "gitlab-ci@${CI_SERVER_HOST}"
  script:
    - |
      set -e
      . ./helm.env
      make git-tag-chart
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
