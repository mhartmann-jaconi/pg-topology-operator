include:
  - project: 'comvidence/sources/dpe/tools'
    file: 'gitlab-ci/templates/software-bundles.yml'
    ref: master
  - project: 'comvidence/sources/dpe/dev-tools/dpe-auto-tag'
    file: 'gitlab-ci/dpe-auto-tag.yml'
    ref: main

stages:
  - build

default:
  tags:
    - docker
    - non-privileged
    - no-internet

variables:
  APP_NAME: "pg-topology-operator"
  DOCKER_REGISTRY: "docker.lp.rsint.net"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_DRIVER: "overlay2"
  HELM_REPO_PATH: "https://artifactory.lp.rsint.net/artifactory/platform-helm"

docker:
  stage: build
  before_script:
    # TODO get an actual image tag
    - DOCKER_IMAGE=${DOCKER_REGISTRY}/platform/${APP_NAME}:latest
  script: 
    - make docker-build
    - make docker-upload

helm:
  stage: build
  script:
    - make helm-package
    - make helm-upload
  artifacts:
    paths:
      - build
